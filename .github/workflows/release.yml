name: Release

# Push a tag like v1.2.3 to publish a signed APK. Obtainium picks it up from GitHub Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "${name%%-*}"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PILLAR_KEYSTORE_BASE64 }}
        run: |
          # Releases must always use the same key or Android refuses the update.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "PILLAR_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          PILLAR_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          PILLAR_KEYSTORE_PASSWORD: ${{ secrets.PILLAR_KEYSTORE_PASSWORD }}
          PILLAR_KEY_ALIAS: ${{ secrets.PILLAR_KEY_ALIAS }}
          PILLAR_KEY_PASSWORD: ${{ secrets.PILLAR_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease --no-daemon \
            -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "Pillar-${{ steps.version.outputs.name }}.apk"

      - name: Verify signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "Pillar-${{ steps.version.outputs.name }}.apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "Refusing to publish a debug-signed APK"; exit 1; fi

      - uses: softprops/action-gh-release@v2
        with:
          name: Pillar ${{ steps.version.outputs.name }}
          files: Pillar-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.name, '-') }}
